<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Architektura aplikacji E-firma</title>
  <desc id="desc">Diagram warstw: React, Laravel API, MySQL oraz PDF i QR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720">
      <stop stop-color="#082F49"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="110" r="250" fill="#38BDF8" opacity="0.09"/>
  <circle cx="120" cy="650" r="260" fill="#F59E0B" opacity="0.1"/>
  <text x="80" y="84" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Architektura</text>
  <text x="80" y="120" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="18">Glowny przeplyw: React na porcie 3000 komunikuje sie z Laravel API i baza MySQL.</text>
  <g>
    <rect x="86" y="196" width="300" height="210" rx="28" fill="url(#panel)" stroke="#7DD3FC" stroke-opacity="0.35"/>
    <text x="128" y="252" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">React + Vite</text>
    <text x="128" y="294" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">katalog react/</text>
    <text x="128" y="332" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">routing, panele, axios</text>
    <text x="128" y="370" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">TOKEN w localStorage</text>
  </g>
  <g>
    <rect x="490" y="196" width="300" height="210" rx="28" fill="url(#panel)" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="532" y="252" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Laravel API</text>
    <text x="532" y="294" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">routes/api.php</text>
    <text x="532" y="332" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">kontrolery i modele</text>
    <text x="532" y="370" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Sanctum middleware</text>
  </g>
  <g>
    <rect x="894" y="196" width="300" height="210" rx="28" fill="url(#panel)" stroke="#FBBF24" stroke-opacity="0.42"/>
    <text x="936" y="252" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">MySQL</text>
    <text x="936" y="294" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">database/e_firma.sql</text>
    <text x="936" y="332" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">relacje i dane testowe</text>
    <text x="936" y="370" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">triggery + funkcja SQL</text>
  </g>
  <path d="M386 301 H490" stroke="#38BDF8" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M790 301 H894" stroke="#38BDF8" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M490 344 H390" stroke="#38BDF8" stroke-width="3" opacity="0.65" marker-end="url(#arrow)"/>
  <path d="M894 344 H794" stroke="#38BDF8" stroke-width="3" opacity="0.65" marker-end="url(#arrow)"/>
  <g>
    <rect x="236" y="500" width="250" height="92" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="361" y="538" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">QR / Drzwi</text>
    <text x="361" y="568" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Simple QR Code</text>
  </g>
  <g>
    <rect x="515" y="500" width="250" height="92" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="640" y="538" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Raporty PDF</text>
    <text x="640" y="568" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">DomPDF</text>
  </g>
  <g>
    <rect x="794" y="500" width="250" height="92" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="919" y="538" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Mail</text>
    <text x="919" y="568" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">haslo tymczasowe</text>
  </g>
  <path d="M640 406 V500" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
</svg>
