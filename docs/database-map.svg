<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Uproszczona mapa bazy danych E-firma</title>
  <desc id="desc">Diagram najwazniejszych tabel i mechanizmow SQL w bazie projektu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="72" y="78" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">Baza danych</text>
  <text x="72" y="114" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="18">Najwazniejsze tabele, relacje i mechanizmy SQL z pliku database/e_firma.sql.</text>
  <g filter="url(#shadow)">
    <rect x="498" y="166" width="284" height="102" rx="22" fill="#0F766E"/>
    <text x="640" y="208" text-anchor="middle" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">pracownicy</text>
    <text x="640" y="239" text-anchor="middle" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="15">konto, grupa, stanowisko, urlop</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="116" y="328" width="246" height="92" rx="20" fill="#FFFFFF"/>
    <text x="239" y="364" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">karta_dostepu</text>
    <text x="239" y="394" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15">aktywnosc i wlasciciel</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="400" y="328" width="246" height="92" rx="20" fill="#FFFFFF"/>
    <text x="523" y="364" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">strefy_dostepu</text>
    <text x="523" y="394" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15">budynki i uprawnienia</text>
  </g>
