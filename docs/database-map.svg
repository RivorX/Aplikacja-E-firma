    <text x="807" y="364" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">drzwi</text>
    <text x="807" y="394" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15">QR i wejscia/wyjscia</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="968" y="328" width="246" height="92" rx="20" fill="#FFFFFF"/>
    <text x="1091" y="364" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">logi_kart</text>
    <text x="1091" y="394" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15">proby dostepu</text>
