    <text x="981" y="550" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">urlopy / wyplaty</text>
    <text x="981" y="580" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="15">obszary do rozwoju</text>
