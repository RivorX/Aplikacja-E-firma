  <path d="M612 268 L542 328" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M684 268 L780 328" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 374 H968" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M362 374 H400" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M930 374 H968" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M604 268 L330 514" stroke="#64748B" stroke-width="3" opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M640 268 V514" stroke="#64748B" stroke-width="3" opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M690 268 L946 514" stroke="#64748B" stroke-width="3" opacity="0.75" marker-end="url(#arrow)"/>
  <rect x="72" y="650" width="1136" height="34" rx="17" fill="#DCFCE7"/>
  <text x="640" y="672" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Mechanizmy SQL: funkcja czas_przebywania_pracownika + triggery logujace operacje na strefach dostepu</text>
